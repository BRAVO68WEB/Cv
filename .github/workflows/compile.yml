name: Generate PDF

on:
  workflow_dispatch:
  push:
    paths:
      - "resume.yaml"
      - "Makefile"
      - "requirements.txt"
      - ".github/workflows/compile.yml"
    tags:
      - "**"
  pull_request:
    paths:
      - "resume.yaml"
      - "Makefile"
      - "requirements.txt"
      - ".github/workflows/compile.yml"
  workflow_run:
    workflows: ["Tag"]
    types:
      - completed

env:
  PDF_NAME: Jyotirmoy_Bandyopadhayaya_CV.pdf
  HTML_NAME: Jyotirmoy_Bandyopadhayaya_CV.html
  MISC_NAME: resume.zip
  # Pin must match local tooling (RenderCV 2.x / Typst). Design keys like
  # typography/section_titles require 2.x; 1.8 is LaTeX-era and incompatible.
  RENDERCV_VERSION: "2.8"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 📦 Install RenderCV
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import rendercv; print('rendercv OK')"
          rendercv --version

      - name: 📄 Generate PDF
        run: make all

      - name: 🔎 Verify outputs
        run: |
          test -f "rendercv_output/${{ env.PDF_NAME }}"
          test -f "rendercv_output/${{ env.HTML_NAME }}"
          test -f "${{ env.MISC_NAME }}"
          ls -la rendercv_output/

      - name: 📤 Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: rendercv_output/${{ env.PDF_NAME }}

      - name: 📤 Upload Misc artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-misc-zip
          path: ${{ env.MISC_NAME }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Download Tag Artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: tag
          path: .
        continue-on-error: true

      - name: 🏷️ Determine Tag Name
        id: determine_tag
        run: |
          TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" == "workflow_run" ]; then
            if [[ -n "${{ github.event.workflow_run.outputs.new_tag }}" ]]; then
              TAG_NAME="${{ github.event.workflow_run.outputs.new_tag }}"
            elif [[ -f tag.txt ]]; then
              TAG_NAME=$(cat tag.txt)
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "Using tag $TAG_NAME"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: 🔍 Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "No tag name found, skipping release check"
            exit 1
          fi
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release for tag $TAG_NAME already exists."
            exit 1
          else
            echo "Tag is present, valid and no existing releases exist. Continuing with $TAG_NAME...."
          fi

      - name: 📤 Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf
          path: rendercv_output/

      - name: 📤 Download Misc artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-misc-zip
          path: .

      - name: 📄 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" "rendercv_output/${{ env.PDF_NAME }}" \
            --title "Release $TAG_NAME" \
            --notes "Generated CV PDF for release $TAG_NAME"

      - name: 📄 Upload assets to docs/ folder
        run: |
          mkdir -p docs-temp dl docs
          mv "${{ env.MISC_NAME }}" "dl/${{ env.MISC_NAME }}"
          unzip -o "dl/${{ env.MISC_NAME }}" -d docs-temp/
          cp "docs-temp/rendercv_output/${{ env.PDF_NAME }}" docs/cv.pdf
          cp "docs-temp/rendercv_output/${{ env.HTML_NAME }}" docs/index.html
          rm -rf docs-temp dl
          git config user.name "b68web"
          git config user.email "git@b68.dev"
          git add docs/
          git commit -m "Add release $TAG_NAME" || echo "No docs changes to commit"
          git push origin HEAD:main
